[project]
name = "appgen"
version = "0.1.0"
description = "Multi-agent job application site generator (LangGraph + AWS Bedrock + MCP)"
authors = [
    { name = "Priyanka Veerabhadra", email = "pveerabhadra@uni-osnabrueck.de" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-aws>=1.9.1",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=1.30.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
appgen = "appgen.runner:main"
appgen-service = "appgen.service:main"
appgen-mcp = "appgen.mcp_server:main"
appgen-eval = "appgen.evaluate:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
